# cargo-deny policy for Tessera (spec WP8: supply chain).
# Run: `cargo deny check` (or `just deny`).

[graph]
# The broker runs only on Linux; don't pull in other platforms' dependency
# trees (and their licenses/advisories) for evaluation.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# RustSec advisory DB. Any vulnerability, or an unmaintained/unsound crate
# anywhere in the graph, fails the check unless explicitly ignored here with
# a justification.
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with Apache-2.0 distribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# ring: OpenSSL/ISC-style license text that cargo-deny cannot always classify.
[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Workspace crates use `path = ...` dependencies without versions; every
# workspace crate is `publish = false`, so with allow-wildcard-paths those
# are accepted and any registry wildcard is an error.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# Crates we never want in the trusted computing base.
deny = [
    # Tessera uses rustls; a second TLS stack in the TCB is a review burden.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
# Only crates.io; no git dependencies or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
