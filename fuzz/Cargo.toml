[package]
name = "tessera-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"
description = "cargo-fuzz targets for Tessera's untrusted-input parsers and the authority core"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
postcard = { version = "1.2.0", default-features = false, features = ["alloc", "use-std"] }
serde_json = "1"
tessera-protocol = { path = "../crates/protocol" }
tessera-approval = { path = "../crates/approval" }
tessera-journal = { path = "../crates/journal" }
tessera-capability-core = { path = "../crates/capability-core" }

# Not part of the main workspace (needs nightly + sanitizers).
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "protocol_decode_client"
path = "fuzz_targets/protocol_decode_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_decode_server"
path = "fuzz_targets/protocol_decode_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_reader"
path = "fuzz_targets/frame_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "approval_grant_request"
path = "fuzz_targets/approval_grant_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "approval_enrollment"
path = "fuzz_targets/approval_enrollment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_recover"
path = "fuzz_targets/journal_recover.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_state_decode"
path = "fuzz_targets/core_state_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_step"
path = "fuzz_targets/core_step.rs"
test = false
doc = false
bench = false
