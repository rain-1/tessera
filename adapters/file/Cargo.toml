[package]
name = "tessera-adapter-file"
version = "0.1.0"
edition = "2024"
description = "Tessera trusted file adapter: registered logical file slots, bounded snapshot reads and atomic replacement"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
