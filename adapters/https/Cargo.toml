[package]
name = "tessera-adapter-https"
version = "0.1.0"
publish = false
edition = "2024"
description = "Tessera trusted HTTPS adapter: registered endpoints, one bounded request attempt per reservation"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tokio = { version = "1", features = ["full"] }
