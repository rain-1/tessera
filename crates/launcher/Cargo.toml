[package]
name = "tessera-launcher"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"
description = "Trusted sandbox launcher for Tessera (bubblewrap + seccomp + Landlock + cgroup v2)"

[lints]
workspace = true

[dependencies]
seccompiler = "0.5"
landlock = "0.4.8"
command-fds = "0.3"
rustix = { version = "1", features = ["process", "net", "fs", "event", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tessera-launch-probe"
path = "src/bin/tessera-launch-probe.rs"

[[bin]]
name = "tessera-sandbox-init"
path = "src/bin/tessera-sandbox-init.rs"

[[bin]]
name = "tessera-launch-run"
path = "src/bin/tessera-launch-run.rs"
