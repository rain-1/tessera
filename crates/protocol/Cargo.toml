[package]
name = "tessera-protocol"
version = "0.1.0"
publish = false
edition = "2024"
license.workspace = true
rust-version.workspace = true
description = "Untrusted, bounded wire schema and framing for the Tessera broker IPC"

[dependencies]
postcard = { version = "1.2.0", default-features = false, features = ["alloc", "use-std"] }
rustix = { version = "1.1.6", features = ["net", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"

[lints]
workspace = true
